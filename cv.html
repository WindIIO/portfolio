<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Lucas Ribet</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0a0a0e;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }
      .topbar {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
      }
      .topbar a {
        color: #3f8efc;
        text-decoration: none;
        font-weight: 700;
        background: rgba(18, 20, 27, 0.8);
        padding: 0.5rem 1rem;
        border-radius: 5px;
      }
      .viewer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a href="index.html">Retour au portfolio</a>
    </header>

    <embed
      class="viewer"
      src="img/CV_Support_IT_Ribet.pdf"
      type="application/pdf"
      alt="CV Lucas Ribet"
    />
  </body>
</html>
