<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test de connexion Internet</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0f16;
        color: #f5f7ff;
      }
      .container {
        width: min(980px, 95vw);
        margin: 2rem auto;
        padding: 1rem;
      }
      h1 {
        color: #6b63ff;
        margin-bottom: 0.4rem;
      }
      p.subtitle {
        color: #c0c6ee;
        margin-bottom: 1.2rem;
      }
      .btn {
        padding: 0.7rem 1.1rem;
        border: none;
        border-radius: 8px;
        background: #6b63ff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }
      .btn:hover {
        transform: scale(1.04);
        box-shadow: 0 12px 18px rgba(107, 99, 255, 0.45);
        background: #5549e4;
      }
      .loader {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #1b2146;
        border: 1px solid #3e4ea3;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        margin-top: 1rem;
        animation: pulse 1.2s alternate infinite;
      }
      .loader .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b63ff;
        animation: bounce 0.6s ease-in-out infinite alternate;
      }
      .loader .dot:nth-child(2) {
        animation-delay: 0.13s;
      }
      .loader .dot:nth-child(3) {
        animation-delay: 0.26s;
      }
      .status-success {
        color: #8ce09a;
        font-weight: 700;
      }
      .status-fail {
        color: #ff7575;
        font-weight: 700;
      }
      @keyframes bounce {
        to {
          transform: translateY(-6px);
        }
      }
      @keyframes pulse {
        to {
          box-shadow: 0 0 24px rgba(107, 99, 255, 0.4);
        }
      }
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .box {
        background: #131a36;
        border: 1px solid #22346a;
        border-radius: 12px;
        padding: 1rem;
        margin-top: 1rem;
      }
      .bar {
        height: 14px;
        background: #2f68f7;
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container reveal">
      <h1><i class="fa-solid fa-wifi"></i> Test de connexion Internet</h1>
      <p class="subtitle">
        Mesure de ping, download et upload directement dans le navigateur.
      </p>
      <button id="doTest" class="btn">
        <i class="fa-solid fa-tachometer-alt"></i> Lancer le test
      </button>
      <div id="loader" class="loader" style="display: none">
        <span class="dot"></span><span class="dot"></span
        ><span class="dot"></span>
        <span>Test en cours...</span>
      </div>
      <div id="status" class="reveal" style="margin-top: 1rem">
        Prêt à tester...
      </div>
      <div id="results" class="grid reveal"></div>
    </div>
    <script>
      const doTest = document.getElementById("doTest");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const loader = document.getElementById("loader");

      function createCard(label, value) {
        const div = document.createElement("div");
        div.className = "box";
        div.innerHTML = `<strong>${label}</strong><p style="font-size:1.5rem;margin:.4rem 0 0;">${value}</p>`;
        return div;
      }

      function testPing() {
        const url =
          "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js?" +
          Date.now();
        const start = performance.now();
        return fetch(url, { cache: "no-store" })
          .then(() => performance.now() - start)
          .catch(() => null);
      }

      function testThroughput(size) {
        const url =
          "https://upload.wikimedia.org/wikipedia/commons/3/3c/Shaki_waterfall.jpg";
        const start = performance.now();
        return fetch(url, { cache: "no-store" })
          .then((resp) => resp.blob())
          .then((blob) => {
            const end = performance.now();
            const bits = blob.size * 8;
            const seconds = (end - start) / 1000;
            return (bits / seconds / 1024 / 1024).toFixed(2);
          })
          .catch(() => null);
      }

      doTest.addEventListener("click", async () => {
        loader.style.display = "flex";
        status.textContent = "Test en cours...";
        status.className = "reveal";
        results.innerHTML = "";
        doTest.disabled = true;

        const ping = await testPing();
        const download = await testThroughput();
        const upload = "Mesure upload non supportée dans ce test simple";

        setTimeout(() => {
          loader.style.display = "none";

          if (ping === null || download === null) {
            status.textContent = "Erreur de connexion (CORS/réseau).";
            status.classList.add("status-fail");
            doTest.disabled = false;
            return;
          }

          status.textContent = "Test réussi !";
          status.classList.add("status-success");
          results.appendChild(createCard("Ping", ping.toFixed(0) + " ms"));
          results.appendChild(createCard("Download", download + " Mbps"));
          results.appendChild(createCard("Upload", upload));

          const bar = document.createElement("div");
          bar.className = "box";
          bar.innerHTML = `<strong>Graphique</strong><div style="margin-top:.6rem; background:#0f1330; padding:.5rem; border-radius:10px;"><div class="bar" style="width:${Math.min(download * 3, 100)}%;"></div></div><p style="margin:.45rem 0 0;color:#a5ade2;font-size:.9rem;">Largeur calculée sur download (target 30 Mbps = 100%)</p>`;
          results.appendChild(bar);
          doTest.disabled = false;
        }, 1200);
      });

      function revealOnScroll() {
        const reveals = document.querySelectorAll(".reveal");
        const winHeight = window.innerHeight;
        reveals.forEach((el) => {
          const top = el.getBoundingClientRect().top;
          if (top < winHeight - 80) {
            el.classList.add("reveal-visible");
          }
        });
      }
      window.addEventListener("load", revealOnScroll);
      window.addEventListener("scroll", revealOnScroll);
    </script>
  </body>
</html>
