<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <title>Scanner système navigateur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tools.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">Projets • Scanner système navigateur</div>
        <a class="back-link" href="index.html">Retour au portfolio</a>
      </div>
    </header>

    <main class="container">
      <h1>Scanner système navigateur</h1>
      <p class="subtitle">
        Affiche quelques informations accessibles depuis les API Web. Les
        navigateurs ne donnent pas accès aux détails du processeur, de la carte
        graphique ou du stockage.
      </p>
      <button id="start" class="btn" type="button">
        Afficher les informations
      </button>
      <section id="results" aria-live="polite"></section>
      <section id="export"></section>
    </main>

    <script>
      const start = document.getElementById("start");
      const resultsSection = document.getElementById("results");
      const exportSection = document.getElementById("export");

      function createCard(title, value) {
        const card = document.createElement("article");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const text = document.createElement("p");
        text.textContent = value;

        card.append(heading, text);
        return card;
      }

      start.addEventListener("click", () => {
        const data = {
          browser: {
            userAgent: navigator.userAgent,
            platform: navigator.platform || "Non disponible",
            language: navigator.language || "Non disponible",
          },
          device: {
            logicalCores: navigator.hardwareConcurrency || "Non disponible",
            memoryEstimate: navigator.deviceMemory
              ? `${navigator.deviceMemory} Go (valeur indicative)`
              : "Non disponible",
            online: navigator.onLine,
          },
          unavailable: {
            processorModel: "Non accessible depuis une page Web",
            graphicsCard: "Non accessible depuis une page Web",
            storageDetails: "Non accessibles depuis une page Web",
          },
          timestamp: new Date().toISOString(),
        };

        resultsSection.replaceChildren();
        const heading = document.createElement("h2");
        heading.textContent = "Informations disponibles";

        const grid = document.createElement("div");
        grid.className = "grid";
        grid.append(
          createCard("Navigateur", data.browser.userAgent),
          createCard("Plateforme (indicative)", data.browser.platform),
          createCard("Langue", data.browser.language),
          createCard("Cœurs logiques", String(data.device.logicalCores)),
          createCard("Mémoire estimée", data.device.memoryEstimate),
          createCard(
            "Connexion déclarée",
            data.device.online ? "En ligne" : "Hors ligne",
          ),
          createCard("Modèle du processeur", data.unavailable.processorModel),
          createCard("Carte graphique", data.unavailable.graphicsCard),
          createCard("Stockage", data.unavailable.storageDetails),
        );
        resultsSection.append(heading, grid);

        const exportButton = document.createElement("button");
        exportButton.className = "btn";
        exportButton.type = "button";
        exportButton.textContent = "Exporter les résultats en JSON";
        exportButton.addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "scanner-systeme-resultats.json";
          link.click();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        });
        exportSection.replaceChildren(exportButton);
      });
    </script>
  </body>
</html>
