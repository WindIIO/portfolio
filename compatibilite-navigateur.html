<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compatibilité navigateur</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0f16;
        color: #eeefff;
      }
      .container {
        width: min(940px, 95vw);
        margin: 2rem auto;
        padding: 1rem;
      }
      h1 {
        color: #6b63ff;
      }
      p.subtitle {
        color: #c5cdf3;
        margin-bottom: 1rem;
      }
      .card {
        background: #151b36;
        border: 1px solid #27356c;
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .ok {
        color: #94f0a1;
        font-weight: 700;
      }
      .ko {
        color: #ff9a99;
        font-weight: 700;
      }
      .btn {
        padding: 0.7rem 1rem;
        border: none;
        border-radius: 8px;
        background: #6b63ff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          filter 0.2s ease,
          background 0.2s ease;
      }
      .btn:hover {
        transform: scale(1.04);
        filter: brightness(1.1);
        background: #5549e4;
      }
      .card {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 14px 28px rgba(15, 22, 58, 0.45);
      }
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container reveal">
      <h1>
        <i class="fa-solid fa-globe"></i> Vérificateur de compatibilité
        navigateur
      </h1>
      <p class="subtitle">
        Test des technologies WebGL, WebRTC et WebUSB, avec recommandations si
        manques.
      </p>
      <button id="check" class="btn">
        <i class="fa-solid fa-check-circle"></i> Vérifier mon navigateur
      </button>
      <div id="features" class="reveal" style="margin-top: 1rem"></div>
    </div>
    <script>
      const check = document.getElementById("check");
      const features = document.getElementById("features");

      function testFeature(label, condition, recommendation) {
        const div = document.createElement("div");
        div.className = "card";
        const icon = condition ? "fa-circle-check" : "fa-circle-xmark";
        const color = condition ? "status-success" : "status-fail";
        div.innerHTML = `<span style="display:flex;align-items:center;gap:.6rem;"><i class="fa-solid ${icon} feature-icon"></i>${label}</span><span class='${color}'>${condition ? "Supporté" : "Non supporté"}</span>`;
        features.appendChild(div);
        if (!condition) {
          const tip = document.createElement("p");
          tip.style.color = "#c9d5ff";
          tip.style.margin = "0 .2rem .7rem";
          tip.textContent = recommendation;
          features.appendChild(tip);
        }
      }

      check.addEventListener("click", () => {
        features.innerHTML = "";
        const webgl = (() => {
          try {
            const c = document.createElement("canvas");
            return (
              !!window.WebGLRenderingContext &&
              (c.getContext("webgl") || c.getContext("experimental-webgl"))
            );
          } catch (e) {
            return false;
          }
        })();
        const webrtc = !!(
          navigator.mediaDevices && navigator.mediaDevices.getUserMedia
        );
        const webusb = "usb" in navigator;
        testFeature(
          "WebGL",
          webgl,
          "Mettez à jour votre navigateur ou activez WebGL dans les paramètres GPU.",
        );
        testFeature(
          "WebRTC",
          webrtc,
          "Utilisez Chrome/Edge/Safari récents pour supporter la webcam/micro.",
        );
        testFeature(
          "WebUSB",
          webusb,
          "WebUSB est encore limité : utilisez Chrome/Edge et activez les flags si nécessaire.",
        );
      });

      function revealOnScroll() {
        const reveals = document.querySelectorAll(".reveal");
        const windowHeight = window.innerHeight;
        reveals.forEach((el) => {
          const top = el.getBoundingClientRect().top;
          if (top < windowHeight - 80) {
            el.classList.add("reveal-visible");
          }
        });
      }
      window.addEventListener("load", revealOnScroll);
      window.addEventListener("scroll", revealOnScroll);
    </script>
  </body>
</html>
