<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <title>Vérificateur de compatibilité navigateur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tools.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">Projets • Compatibilité navigateur</div>
        <a class="back-link" href="index.html">Retour au portfolio</a>
      </div>
    </header>

    <main class="container">
      <h1>Vérificateur de compatibilité navigateur</h1>
      <p class="subtitle">
        Vérifie la disponibilité de différentes API Web dans le navigateur.
        Cette vérification indique la présence des API, pas le fonctionnement
        d'un appareil ou d'un service externe.
      </p>
      <button id="check" class="btn" type="button">
        Vérifier mon navigateur
      </button>
      <section id="features" aria-live="polite" style="margin-top: 1rem"></section>
    </main>

    <script>
      const check = document.getElementById("check");
      const features = document.getElementById("features");

      function addFeature(label, available, recommendation) {
        const card = document.createElement("article");
        card.className = "card";

        const name = document.createElement("h2");
        name.textContent = label;

        const status = document.createElement("p");
        status.className = available ? "status-success" : "status-fail";
        status.textContent = available ? "API disponible" : "API indisponible";
        card.append(name, status);
        features.appendChild(card);

        if (!available) {
          const tip = document.createElement("p");
          tip.className = "subtitle";
          tip.textContent = recommendation;
          features.appendChild(tip);
        }
      }

      check.addEventListener("click", () => {
        features.replaceChildren();

        let webglAvailable = false;
        try {
          const canvas = document.createElement("canvas");
          webglAvailable =
            !!window.WebGLRenderingContext &&
            !!(canvas.getContext("webgl") ||
              canvas.getContext("experimental-webgl"));
        } catch {
          webglAvailable = false;
        }

        const webrtcAvailable = Boolean(
          navigator.mediaDevices && navigator.mediaDevices.getUserMedia,
        );
        const webusbAvailable = "usb" in navigator;

        addFeature(
          "WebGL",
          webglAvailable,
          "Vérifiez la prise en charge WebGL du navigateur et l'accélération graphique.",
        );
        addFeature(
          "WebRTC",
          webrtcAvailable,
          "L'API de capture audio/vidéo n'est pas disponible dans ce contexte.",
        );
        addFeature(
          "WebUSB",
          webusbAvailable,
          "WebUSB n'est pas disponible dans ce navigateur ou ce contexte.",
        );
      });
    </script>
  </body>
</html>
